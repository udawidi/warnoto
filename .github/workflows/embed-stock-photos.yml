name: Embed Foto Stok (cari-kemiripan, tiap 3 hari)
# Kumpulkan material yang fotonya belum punya embedding visual, embed berbarengan
# via Cohere → stock_photo_embeddings. Idempoten (skip yang sudah ada). Mode Bentuk
# di "Cari dengan Foto" jadi mencakup foto baru tanpa perlu jalankan manual.
on:
  schedule:
    - cron: "30 20 */3 * *"   # tiap 3 hari, 20:30 UTC (offset dari job lain)
  workflow_dispatch: {}        # bisa dipicu manual dari tab Actions
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install @supabase/supabase-js
      - name: Embed foto stok yang belum ter-index
        env:
          NEW_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEW_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
        run: node scripts/embed_stock_photos.mjs --all --commit
